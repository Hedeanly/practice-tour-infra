name: Deploy to Staging

on:
  push:
    branches: [staging]

env:
  PROJECT_ID: practice-tour-staging
  REGION: asia-southeast1
  SERVICE_NAME: hello-service
  IMAGE: asia-southeast1-docker.pkg.dev/practice-tour-staging/practice-tour-repo/hello-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/91870931219/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sa-github-actions@practice-tour-staging.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud builds submit \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            ./hello-service

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated
