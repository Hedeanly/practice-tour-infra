name: Deploy to Dev

on:
  push:
    branches: [dev]

env:
  PROJECT_ID: practice-tour-dev
  REGION: asia-southeast1
  SERVICE_NAME: hello-service
  IMAGE: asia-southeast1-docker.pkg.dev/practice-tour-dev/practice-tour-repo/hello-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r hello-service/requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          cd hello-service
          pytest test_main.py -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1030418829297/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sa-github-actions@practice-tour-dev.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud builds submit \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            ./hello-service

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated
